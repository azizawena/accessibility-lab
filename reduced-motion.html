<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Reduced Motion Lab</title>
<style>
:root{color-scheme:dark;--bg:#15171a;--panel:#1b1e23;--text:#f4f1f3;--muted:#b8b3b6;--accent:#8b5a75}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:48px 24px}a,button,input,textarea{font:inherit}
a,button{color:var(--text)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.card{padding:20px;border:1px solid #444;background:var(--panel);margin:20px 0}
label{display:block;margin:16px 0 6px}input,textarea{width:100%;padding:12px;background:#111318;color:var(--text);border:1px solid #555}
.error{color:#ffd1dc}nav a{margin-right:18px}
</style>
<style>.dot{width:80px;height:80px;background:var(--accent);border-radius:50%;animation:move 2s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(240px)}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}</style><main><h1>Reduced motion</h1><p>A bolinha se move apenas quando o sistema permite animação.</p><div class="card"><div class="dot"></div></div></main></html>
